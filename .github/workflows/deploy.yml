name: Deploy to GitHub Pages

on:
  push:
    # El repo usa master, no main: con 'main' aqui el workflow no se disparaba
    # nunca. Se listan las dos para que siga funcionando si algun dia se
    # renombra la rama.
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 24, no 20: scripts/check-recipes.mjs usa
          # --experimental-strip-types, que aparecio en la 22.6, y Vite 8 pide
          # ^20.19 || >=22.12. Es la misma version que se usa en local.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Comprobar contenido
        run: npm run check && npm run lint

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4